<script>
const { h, render, Fragment } = preact;
const { useState, useEffect, useMemo, useRef } = preactHooks;
const html = htm.bind(h);

const DATA_URL        = "./data.json";
const CHALLENGERS_URL = "./challengers.json";
const HISTORY_URL     = "./history.json";

// Cycle, election day and chamber sizes come from data.json meta (set by the pipeline).
function META() { return (typeof window !== "undefined" && window._aectMeta) || {}; }
function CYCLE() { const y = new Date().getFullYear(); return META().cycle || (y % 2 ? y + 1 : y); }
function GENERAL_DATE() { return META().general_date || ""; }
function wrongCycleYear(text) {
  // any 20xx year in a market question other than this cycle's means a different election
  return (String(text).match(/\b20\d\d\b/g) || []).some(y => Number(y) !== CYCLE());
}
// Vote-count thresholds derived from chamber size (simple majority, 2/3 veto override,
// Senate cloture = 3/5). The House "chaos" number is the tracker's own benchmark.
function THRESHOLDS_FOR(chamber) {
  const seats = (META().chamber_seats || {})[chamber] || (chamber === "senate" ? 100 : 435);
  const maj = Math.floor(seats / 2) + 1, twoThirds = Math.ceil(seats * 2 / 3);
  if (chamber === "senate") {
    const block = seats - Math.ceil(seats * 3 / 5) + 1;
    return [
      { n:block, label:"Floor Block · Filibuster", color:"#a78bfa",
        desc: block+" senators of any party can sustain a filibuster, keeping a bill from a final vote and tying up the calendar." },
      { n:maj, label:"Majority", color:"#7c3aed",
        desc: maj+" senators pass or defeat anything that reaches the floor, including a Joint Resolution of Disapproval of an arms sale." },
    ];
  }
  return [
    ...(() => {
      // Majority-party defections that sink a party-line rule vote, from the live roster
      const pc = (META().chamber_party || {}).house || {};
      const seated = (pc.R || 0) + (pc.D || 0) + (pc.I || 0);
      const [code, mp, ms] = (pc.R || 0) >= (pc.D || 0) ? ["R", "Republican", pc.R || 0] : ["D", "Democratic", pc.D || 0];
      const sink = seated ? ms - (Math.floor(seated / 2) + 1) + 1 : 0;
      return sink > 0 ? [{ n:sink, party:code, label:"Floor Block · Rule Votes", color:"#a78bfa",
        desc: sink+" "+mp+" defections sink a party-line rule vote ("+ms+" of "+seated+" seated), so a bill never reaches debate; any member can also force delays with quorum calls, motions to adjourn and recorded votes. Minority-party allies already vote against party-line rules, so they are shown but do not change this count." }] : [];
    })(),
    { n:maj, label:"Majority", color:"#7c3aed",
      desc: maj+" votes pass arms restrictions and defeat arms appropriations on the floor." },
  ];
}

const MARKET_DISQUALIFY = [
  "president","presidential","white house","governor","gubernatorial",
  "senate majority","house majority",
  "dnc","rnc","running mate","speak at","expelled","censure",
  "resignation","retire","cabinet","ambassador","vice president",
  "peruvian","peru"," uk ","british","canada","canadian","australian","french",
  "german","mexican","chinese","russian","european","israeli","ukrainian",
  "mayor","attorney general","secretary of state","comptroller","treasurer",
];
const FM = "monospace";

// Central odds validation — call instead of raw polyData[name] everywhere.
// races is optional; pass it when available for election-year gating.
function getValidatedPoly(member, polyData, races) {
  if (!member || !polyData) return null;
  const pd = polyData[member.name];
  if (!pd || pd.prob == null) return null;
  const q   = (pd.question || "").toLowerCase();
  const src = pd.src || "";

  // 1. Disqualified market topics
  if (MARKET_DISQUALIFY.some(b => q.includes(b))) return null;

  // 2. Wrong election year (past or future cycle)
  if (wrongCycleYear(q)) return null;

  // 3. Last name must appear as a WHOLE WORD in the question
  //    (substring check caused "Roy" to match "Royce", etc.)
  //    Skip this check for predictit_contract whose questions are market-level
  //    (shared across multiple candidates — no individual name in text).
  if (src !== "predictit_contract") {
    const last = member.name.split(" ").pop().toLowerCase();
    if (last.length > 1) {
      const wordRe = new RegExp("(?:^|[^a-z])" + last + "(?:[^a-z]|$)");
      if (!wordRe.test(q)) return null;
    }
  }

  // 4. Departed / not-running members — suppress odds entirely
  if (["RETIRING", "RESIGNED", "RETIRED", "FLIPPED"].includes(member.ps)) return null;

  // 5. Not on this cycle's ballot: race entry exists but has no election dates
  //    (e.g. a senator whose class is not up this cycle)
  //    Hide until Jan 1 of the year their actual race begins.
  if (races) {
    const race = races.find(r => r.name === member.name);
    if (race && !race.primary_date && !race.general_date && src !== "grok_estimate") {
      return null;
    }
  }

  return pd;
}

function side(m) {
  // Independents sit with the party they caucus with (Kiley → R, Sanders/King → D)
  if (m.caucus === "R" || m.caucus === "D") return m.caucus;
  return m.party === "R" ? "R" : "D";
}

const LEAVING = ["DEFEATED","RETIRING","FAILED_PRIMARY"];
// Two groups only: anti-establishment (the pipeline's "hard" verdict) or establishment.
// Anyone the pipeline judged "soft" (first-time, one-off, lapsed or lobby-funded anti
// signals) is establishment here. On load, antiArms is set to this verdict (see App).
// Data from before tiers existed has no antiTier, so it counts as before.
const HIGH_ODDS = 0.5;   // market probability that separates "likely" from "long shot" new candidates
function isAntiE(m) { return !!m.antiArms && (m.antiTier ? m.antiTier === "hard" : true); }
const isHard = m => !!m.antiArms;
const COL = {estR:"#dc2626", estD:"#2563eb", antiR:"#fca5a5", antiD:"#93c5fd"};

function dotColor(m) {
  if (m._filler) return "#1e2230";
  if (m.antiArms) return side(m) === "R" ? COL.antiR : COL.antiD;
  return side(m) === "R" ? COL.estR : COL.estD;
}

function antiArmsTag(m) {
  if (!m.antiArms) return null;
  return "Anti-Intervention";
}

function antiArmsTagColor(m) {
  if (!m.antiArms) return "#374151";
  return side(m) === "R" ? COL.antiR : COL.antiD;
}

function computeHemicycle(allMembers, chamber, cx, cy) {
  const ch = chamber === "senate" ? "senate" : "house";

  // Every sitting member holds a seat until the term ends; those leaving are drawn faded,
  // so only true vacancies are empty seats.
  const active = allMembers.filter(m => m.chamber === ch && !["RETIRED","RESIGNED"].includes(m.ps));

  // establishment Republicans from the left, establishment Democrats from the right,
  // anti-establishment members of both parties crowd the center
  const antiR    = active.filter(m =>  m.antiArms && side(m) === "R");
  const antiD    = active.filter(m =>  m.antiArms && side(m) === "D");
  const restR    = active.filter(m => !m.antiArms && side(m) === "R");
  const restD    = active.filter(m => !m.antiArms && side(m) === "D");
  const restOther= [];
  const antiCount= antiR.length + antiD.length;
  const filler   = {_filler:true, antiArms:false, party:"", name:""};

  // ── Best-practice geometry (parliamentarch algorithm) ────────────────────
  // innerR and nRows fixed per chamber for stable visual; rowCounts derived
  // proportionally to arc circumference so outer rows have more seats.
  const innerR  = ch === "senate" ? 80 : 52;
  const nRows   = ch === "senate" ? 4  : 9;
  const spacing = ch === "senate" ? 28 : 22;
  const nSeats  = (META().chamber_seats || {})[ch] || (ch === "senate" ? 100 : 435);

  // Row radii
  const radii = Array.from({length:nRows}, (_,i) => innerR + i * spacing);

  // Seats per row proportional to circumference (r × π) so density is uniform.
  // Then scale so sum == nSeats.
  const rawCounts = radii.map(r => r * Math.PI);
  const rawSum    = rawCounts.reduce((s,v) => s+v, 0);
  let rowCounts   = rawCounts.map(v => Math.round(v / rawSum * nSeats));

  // Correction: adjust largest row up/down until sum matches exactly
  let total = rowCounts.reduce((s,v) => s+v, 0);
  let adj = nSeats - total;
  // distribute correction across the largest rows first
  const order = rowCounts.map((_,i) => i).sort((a,b) => rowCounts[b]-rowCounts[a]);
  for (let k = 0; k < Math.abs(adj); k++) {
    const idx = order[k % order.length];
    rowCounts[idx] += adj > 0 ? 1 : -1;
  }
  total = rowCounts.reduce((s,v) => s+v, 0);

  // ── Per-row allocation: [restR | antiR | antiD | restD] ─────────────────
  // Establishment R far left, anti-E R and anti-E D in the center, establishment D far right.
  // Each group gets seats proportional to its share of total, with a correction
  // loop so each group sums to exactly its real count.
  const nAntiD = antiD.length, nAntiR = antiR.length;
  const nRestD = restD.length + restOther.length, nRestR = restR.length;

  function allocGroup(groupSize, rowCount, rowTotal) {
    return Math.round(groupSize * rowCount / rowTotal);
  }
  function correctionPass(perRow, target) {
    let diff = target - perRow.reduce((s,v) => s+v, 0);
    for (let i = perRow.length-1; i >= 0 && diff !== 0; i--) {
      if (diff > 0) { perRow[i]++; diff--; }
      else if (perRow[i] > 0) { perRow[i]--; diff++; }
    }
  }

  const antiDPerRow = rowCounts.map(c => allocGroup(nAntiD, c, total));
  const restDPerRow = rowCounts.map(c => allocGroup(nRestD, c, total));
  const restRPerRow = rowCounts.map(c => allocGroup(nRestR, c, total));
  const antiRPerRow = rowCounts.map(c => allocGroup(nAntiR, c, total));
  correctionPass(antiDPerRow, nAntiD);
  correctionPass(restDPerRow, nRestD);
  correctionPass(restRPerRow, nRestR);
  correctionPass(antiRPerRow, nAntiR);

  let antiDq = [...antiD], restDq = [...restD, ...restOther];
  let restRq = [...restR],  antiRq = [...antiR];

  const result = [];
  for (let ri = 0; ri < nRows; ri++) {
    const count = rowCounts[ri];
    const r     = radii[ri];

    // Build row left→right: restR | antiR | antiD | restD
    const row = [];
    const aDn = antiDPerRow[ri], rDn = restDPerRow[ri];
    const rRn = restRPerRow[ri], aRn = antiRPerRow[ri];

    // If row total doesn't match due to rounding, pad/trim restD (largest group)
    const rowSum = aDn + rDn + rRn + aRn;
    const pad    = count - rowSum;  // usually 0, occasionally ±1

    for (let s = 0; s < rRn; s++)        row.push(restRq.length  ? restRq.shift()  : filler);
    for (let s = 0; s < aRn; s++)        row.push(antiRq.length  ? antiRq.shift()  : filler);
    for (let s = 0; s < aDn; s++)        row.push(antiDq.length  ? antiDq.shift()  : filler);
    for (let s = 0; s < rDn + pad; s++)  row.push(restDq.length  ? restDq.shift()  : filler);

    // Seat positions: equal angular spacing across the semicircle
    for (let s = 0; s < count; s++) {
      const m     = row[s] || filler;
      const angle = count === 1 ? Math.PI/2 : (Math.PI / (count - 1)) * s;
      result.push({...m, _x: cx - r * Math.cos(angle), _y: cy - r * Math.sin(angle)});
    }
  }
  return result;
}

function fmtM(n) {
  if (!n&&n!==0) return "—";
  if (n>=1e6) return "$"+(n/1e6).toFixed(1)+"M";
  if (n>=1e3) return "$"+Math.round(n/1e3)+"K";
  return "$"+n;
}
function StatusBadge({ps}) {
  const MAP = {
    INCUMBENT:       ["#374151","#9ca3af"],
    CHALLENGER:      ["#064e3b","#4ade80"],
    ENDORSED:        ["#1e3a8a","#93c5fd"],
    RETIRED:         ["#1a1d27","#374151"],
    RESIGNED:        ["#1a1d27","#374151"],
    DEFEATED:        ["#3b0000","#f87171"],
    RETIRING:        ["#1a1d27","#6b7280"],
    FAILED_PRIMARY:  ["#3b0000","#f87171"],
    WON:             ["#064e3b","#4ade80"],
    ELECTED:         ["#064e3b","#4ade80"],
    "RE-ELECTED":    ["#064e3b","#4ade80"],
    RESULTS_PENDING: ["#1a1d27","#fbbf24"],
    UPCOMING:        ["#1a1d27","#9ca3af"],
  };
  const [bg, fg] = MAP[ps] || ["#1a1d27","#4b5563"];
  return html`<span style=${{
    fontSize:7, fontFamily:FM, padding:"1px 5px",
    borderRadius:3, background:bg, color:fg,
    border:"1px solid "+fg+"30", letterSpacing:"0.06em",
  }}>${ps||"?"}</span>`;
}

function ArmsBadge({member}) {
  if (!member.antiArms) return null;
  const color = antiArmsTagColor(member);
  return html`<span style=${{
    fontSize:7, fontFamily:FM, padding:"1px 6px",
    borderRadius:3, background:color+"18", color,
    border:"1px solid "+color+"30", letterSpacing:"0.06em",
  }} title=${[member.tier_reason,
              member.tier_screen ? "Screened: " + member.tier_screen : "",
              member.tier_risk && (member.tier_risk.political || member.tier_risk.capital)
                ? "Risk — political: " + (member.tier_risk.political||"?") + ", capital: " + (member.tier_risk.capital||"?")
                  + (member.tier_risk.notes ? " (" + member.tier_risk.notes + ")" : "") : "",
              member.tier_source ? "Judged by " + (member.tier_source.startsWith("ai") ? "AI (" + member.tier_source.slice(3) + ")" : "rule") : ""
             ].filter(Boolean).join("\n")}>
    ◈ Anti-establishment</span>`;
}

// ── Committees: can anti-establishment members stall bills, or control the committee? ──
// Rosters come from data.json (live each run). The chair being anti-establishment is
// significant control on its own; an anti-establishment ranking member counts as two.
const PLANK_LABEL = {power:"procedure & money", anti_arms:"anti-arms", fiscal:"fiscal", labor:"labor", environment:"environment"};
function CommitteeBars({chamber, members}) {
  const list = (window._aectCommittees || []).filter(c => c.chamber === chamber);
  if (!list.length) return null;
  const byBg = {};
  (members || []).forEach(m => { if (m.bioguide_id) byBg[m.bioguide_id] = m; });
  return html`<div style=${{marginBottom:14}}>
    <div style=${{fontSize:10,color:"#a78bfa",fontWeight:600,fontFamily:FM,marginBottom:2}}>Committee Stall</div>
    <div style=${{fontSize:8,fontFamily:FM,color:"#4b5563",marginBottom:7,lineHeight:1.5}}>
      Stall line (amber): the number of majority-party defections that sinks a party-line markup. Anti-establishment members of both parties are counted against it; minority members usually vote no anyway, so the majority party's anti members are the ones who tip it. Control line (white): a majority of the committee. An anti-establishment chair is significant control by itself; an anti-establishment ranking member counts as two.</div>
    ${list.map(c => {
      const seats = c.members.map(x => ({...x, m: byBg[x.bg]}));
      const anti = seats.filter(x => x.m && x.m.antiArms);
      const chair = seats.find(x => /^chair/i.test(x.title));
      const rank = seats.find(x => /ranking/i.test(x.title));
      const chairAnti = !!(chair && chair.m && chair.m.antiArms);
      const score = anti.length + (rank && rank.m && rank.m.antiArms ? 1 : 0);
      const stall = Math.max(1, c.majority - Math.floor(c.size / 2));
      const control = Math.floor(c.size / 2) + 1;
      const pct = n => Math.min(100, n / c.size * 100);
      const state = chairAnti ? ["Chair is anti-establishment: significant control", "#4ade80"]
        : score >= control ? ["Controls the committee", "#4ade80"]
        : score >= stall ? ["Can stall bills", "#fbbf24"]
        : [score + " of " + stall + " needed to stall", "#6b7280"];
      return html`<div key=${c.id} style=${{marginBottom:8}}>
        <div style=${{display:"flex",justifyContent:"space-between",gap:6,fontSize:9,fontFamily:FM,marginBottom:3}}>
          <span style=${{color:"#d1d5db"}}>${c.name} <span style=${{color:"#4b5563"}}>· ${PLANK_LABEL[c.plank] || c.plank}</span></span>
          <span style=${{color:state[1]}}>${state[0]}</span>
        </div>
        <div style=${{position:"relative",height:7,borderRadius:3,background:"#1a1d27"}}>
          <div style=${{position:"absolute",left:0,top:0,bottom:0,width:pct(score)+"%",borderRadius:3,background:chairAnti||score>=stall?"#4ade80":"#818cf8"}}/>
          <div title=${"Stall: " + stall} style=${{position:"absolute",left:pct(stall)+"%",top:-2,bottom:-2,width:1.5,background:"#fbbf24"}}/>
          <div title=${"Control: " + control} style=${{position:"absolute",left:pct(control)+"%",top:-2,bottom:-2,width:1.5,background:"#f0ebe0"}}/>
        </div>
        <div style=${{fontSize:8,fontFamily:FM,color:"#4b5563",marginTop:2}}>
          ${anti.length ? anti.map(x => x.m.name + (x === rank ? " (ranking ×2)" : x === chair ? " (chair)" : "")).join(", ") : "no anti-establishment members"} · ${c.size} seats, stall ${stall}, control ${control}
          ${chair ? html` · chair ${chair.name}` : null}
        </div>
      </div>`;
    })}
  </div>`;
}

function ProgressBars({chamber, members, allMembers, challengers, racesData, polyData}) {
  // anti-establishment incumbents who will still hold the seat
  const current = members.filter(m => isHard(m) && !LEAVING.includes(m.ps)).length;
  const ch = chamber;

  const races = racesData || [];

  const trials = [];

  members.filter(isHard).forEach(m => {
    const race   = races.find(r => r.name === m.name && r.chamber === ch);
    const pm     = getValidatedPoly(m, polyData, races);
    let p;
    if (pm && pm.prob != null)              p = pm.prob;
    else if (race && race.win_prob != null) p = race.win_prob;
    else if (race && race.winProb != null)  p = race.winProb;
    else if (race && race.departing)        p = 0;
    else if (m.not_up_this_cycle)           p = 1;
    else if (["RETIRING","DEFEATED","RESIGNED"].includes(m.ps)) p = 0;
    else if (window._aectRetention != null) p = window._aectRetention;
    else return;  // no market and no measured base rate — leave unpriced
    trials.push({name: m.name, p, party: m.caucus || m.party, src: pm ? "poly" : (m.not_up_this_cycle ? "seat" : "base")});
  });

  const unpriced = [];
  const challSeen = new Set(trials.map(t => t.name.toLowerCase()));
  const allChalls = [
    ...(challengers||[]).filter(c => (c.chamber||"house") === ch),
    ...races.filter(r => r.chamber === ch && (r.type==="challenger" || r.raceType==="CHALLENGER")),
  ];
  allChalls.forEach(r => {
    const key = (r.name||"").toLowerCase();
    if (challSeen.has(key)) return;
    challSeen.add(key);
    const pm = getValidatedPoly(r, polyData, races);
    const ps = r.ps || r.status || "";
    if (["LOST","WITHDREW","DEFEATED","FAILED_PRIMARY"].includes(ps)) return;
    if (r.antiTier === "soft" || r.antiTier === "none") return;   // only reliable candidates count
    const p = pm && pm.prob != null ? pm.prob
            : r.win_prob != null ? r.win_prob
            : r.winProb  != null ? r.winProb
            : null;
    if (p == null) { unpriced.push({name: r.name, party: r.party}); return; }  // no market: don't invent odds
    trials.push({name: r.name, p, party: r.party, src: pm ? "poly" : "market", isChallenger: true});
  });

  const mu     = trials.reduce((s,t) => s+t.p, 0);
  const sigma2 = trials.reduce((s,t) => s+t.p*(1-t.p), 0);
  const sigma  = Math.sqrt(Math.max(sigma2, 0.01));
  const challCount = trials.filter(t => t.isChallenger).length;
  const polyCount  = trials.filter(t => t.src === "poly").length;

  function normCDF(z) {
    if (z>6) return 1; if (z<-6) return 0;
    const t = 1/(1+0.2315419*Math.abs(z));
    const d = 0.3989423*Math.exp(-z*z/2);
    const p = d*t*(0.3193815+t*(-0.3565638+t*(1.7814779+t*(-1.8212560+t*1.3302744))));
    return z>0?1-p:p;
  }
  function pReach(n, party) {
    const ts = party ? trials.filter(t => t.party === party) : trials;
    const m = ts.reduce((s,t) => s+t.p, 0);
    const sd = Math.sqrt(Math.max(ts.reduce((s,t) => s+t.p*(1-t.p), 0), 0.01));
    return Math.max(0, Math.min(1, normCDF(-(n-0.5-m)/sd)));
  }
  function probColor(p) {
    if (p>=0.7) return "#4ade80"; if (p>=0.4) return "#fbbf24";
    if (p>=0.15) return "#f97316"; return "#f87171";
  }
  function probLabel(p) {
    if (p>=0.85) return "Very Likely"; if (p>=0.65) return "Likely";
    if (p>=0.40) return "Possible"; if (p>=0.15) return "Unlikely";
    return "Very Unlikely";
  }

  return html`
    <div style=${{background:"#0f1117",border:"1px solid #1e2230",borderRadius:12,padding:"12px 14px",width:"100%",boxSizing:"border-box"}}>

           ["#c7d2fe",.25,"New, long shot / no market"]].map(([c,o,l])=>html`

        ${polyCount>0 ? html`<span style=${{color:"#4ade80"}}>· ◉ ${polyCount} live odds</span>` : null}
      </div>

      <${CommitteeBars} chamber=${chamber} members=${allMembers || members}/>

      ${THRESHOLDS_FOR(chamber).map((th,i) => {
        // party-scoped thresholds (rule-vote bloc) count only that party's members
        const inParty = x => !th.party || (x.caucus||x.party) === th.party;
        const cur     = members.filter(m => isHard(m) && !LEAVING.includes(m.ps) && inParty(m)).length;
        const newHi   = trials.filter(t => t.isChallenger && t.p >= HIGH_ODDS && inParty(t)).length;
        const newLo   = trials.filter(t => t.isChallenger && t.p < HIGH_ODDS && inParty(t)).length
                      + unpriced.filter(inParty).length;
        const w       = n => Math.max(0, Math.min(100, (n / th.n) * 100));
        const thMu    = th.party ? trials.filter(t => t.party === th.party).reduce((s,t) => s+t.p, 0) : mu;
        const reached = cur >= th.n;
        const prob    = reached ? 1 : pReach(th.n, th.party);
        const pc      = probColor(prob);
        const need    = Math.max(0, th.n-cur);
        const allies  = th.party ? members.filter(m => isHard(m) && !LEAVING.includes(m.ps) && !inParty(m)).length : 0;
        const pTxt    = reached ? "reached" : prob < 0.01 ? "<1% by Nov "+CYCLE() : Math.round(prob*100)+"% by Nov "+CYCLE();
        const segs    = [[cur,"#818cf8",1,cur+" anti-establishment incumbents"],
                         [newHi,"#a5b4fc",.55,newHi+" new candidates likely to win"],
                         [newLo,"#c7d2fe",.25,newLo+" new candidates, long shots"]];

        return html`
          <div key=${i} style=${{marginBottom: i<THRESHOLDS_FOR(chamber).length-1?14:0}}>
            <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4,gap:6}}>
              <span style=${{fontSize:10,color:reached?"#4ade80":th.color,fontWeight:600,fontFamily:FM}}>${th.label}</span>
              <span style=${{fontSize:9,fontFamily:FM,color:"#6b7280"}}>
                <span style=${{color:"#c7d2fe"}}>${cur}</span>${newHi?html`<span style=${{color:"#a5b4fc"}}> +${newHi}</span>`:null}${newLo?html`<span style=${{color:"#6b7280"}}> +${newLo}</span>`:null}
                <span> / ${th.n}</span>
                <span style=${{color:pc,marginLeft:8}}>${pTxt}</span>
              </span>
            </div>
            <div style=${{display:"flex",height:8,borderRadius:4,background:"#1a1d27",overflow:"hidden"}}>
              ${segs.filter(([n])=>n>0).map(([n,c,o,t])=>html`
                <div key=${t} title=${t} style=${{width:w(n)+"%",background:reached&&c==="#818cf8"?"#4ade80":c,opacity:o,transition:"width 0.8s ease"}}/>`)}
            </div>
            <div style=${{fontSize:8,fontFamily:FM,color:"#4b5563",marginTop:4,lineHeight:1.5}}>
              ${reached ? html`<span style=${{color:"#4ade80"}}>✓ Reached with anti-establishment incumbents alone. </span>`
                : cur+newHi+newLo>=th.n ? html`<span style=${{color:"#fbbf24"}}>Reachable only if new candidates win. </span>`

      </div>
    </div>`;
}

// One-line call shown on hover and at the top of the write-up.
function bottomLine(m) {
  if (m.bottom_line) return m.bottom_line;
  const f = m.tier_facts || {};
  if (m.antiArms) return "Counts as anti-establishment" + (f.anti_focus_votes ? ": anti on " + f.anti_focus_votes + " of " + f.focus_votes + " arms votes" + ((f.anti_congresses||[]).length ? " across " + f.anti_congresses.length + " Congresses" : "") : "") + ".";
  if (m.tier_reason) return "Does not count: " + m.tier_reason + ".";
  return "Establishment: no anti-establishment record found.";
}

// Plain-language summary of the facts, used until an AI write-up exists.
function factsWriteup(m) {
  const f = m.tier_facts || {}, out = [];
  if (f.focus_votes) out.push("On " + f.focus_votes + " recorded votes on arms and aid to " + (((META().focus||{}).recipients)||["Israel"]).join(", ") + ", voted the anti side " + (f.anti_focus_votes||0) + " time" + (f.anti_focus_votes===1?"":"s") + (f.latest_congress_focus ? " (" + f.latest_congress_focus + ")" : "") + ".");
  if (f.discharge_petitions_against_own_leadership) out.push("Signed " + f.discharge_petitions_against_own_leadership + " discharge petition" + (f.discharge_petitions_against_own_leadership>1?"s":"") + " going around their own party's House leadership.");
  if (f.lobby_money_trackaipac) out.push("Received " + fmtM(f.lobby_money_trackaipac) + " in contributions tracked by TrackAIPAC.");
  if (f.lobby_outside_support) out.push("Supported by " + fmtM(f.lobby_outside_support) + " in outside spending from the lobby's super PACs.");
  if (f.lobby_outside_oppose) out.push("Targeted by " + fmtM(f.lobby_outside_oppose) + " in outside spending from the lobby's super PACs.");
  if (m.description && !/suggest edit|sign in|⌘k/i.test(m.description)) out.push(m.description);
  return out.join(" ");
}

function censusLookup(address) {
  // U.S. Census Bureau geocoder (no key) via JSONP: address → state + congressional district
  return new Promise((resolve, reject) => {
    const cb = "_aectGeo" + Date.now();
    const sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); };
    const t = setTimeout(() => { done(); reject(new Error("timeout")); }, 15000);
    window[cb] = d => {
      clearTimeout(t); done();
      const m = d && d.result && d.result.addressMatches && d.result.addressMatches[0];
      if (!m) return reject(new Error("no match"));
      const g = m.geographies || {};
      const cdKey = Object.keys(g).find(k => /Congressional District/i.test(k));
      const cd = cdKey && g[cdKey][0];
      const st = (g["States"] || [])[0] || {};
      const state = st.STUSAB || (m.addressComponents || {}).state || "";
      let dist = null;
      if (cd) {
        const code = Object.keys(cd).find(k => /^CD\d+$/.test(k));
        dist = parseInt(code ? cd[code] : (cd.BASENAME || ""), 10);
        if (isNaN(dist) || dist === 98) dist = 0;     // 00 = at-large, 98 = delegate seat
      }
      resolve({state, district: dist, matched: m.matchedAddress});
    };
    sc.onerror = () => { clearTimeout(t); done(); reject(new Error("network")); };
    sc.src = "https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress?address="
      + encodeURIComponent(address) + "&benchmark=Public_AR_Current&vintage=Current_Current"
      + "&layers=all&format=jsonp&callback=" + cb;
    document.head.appendChild(sc);
  });
}
function censusByPoint(lon, lat) {
  // same Census geocoder, by coordinates (from the OpenStreetMap suggestion the visitor picked)
  return new Promise((resolve, reject) => {
    const cb = "_aectPt" + Date.now();
    const sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); };
    const t = setTimeout(() => { done(); reject(new Error("timeout")); }, 15000);
    window[cb] = d => {
      clearTimeout(t); done();
      const g = (d && d.result && d.result.geographies) || {};
      const cdKey = Object.keys(g).find(k => /Congressional District/i.test(k));
      const cd = cdKey && g[cdKey][0];
      const st = (g["States"] || [])[0] || {};
      if (!st.STUSAB) return reject(new Error("no match"));
      let dist = null;
      if (cd) {
        const code = Object.keys(cd).find(k => /^CD\d+$/.test(k));
        dist = parseInt(code ? cd[code] : (cd.BASENAME || ""), 10);
        if (isNaN(dist) || dist === 98) dist = 0;
      }
      resolve({state: st.STUSAB, district: dist});
    };
    sc.onerror = () => { clearTimeout(t); done(); reject(new Error("network")); };
    sc.src = "https://geocoding.geo.census.gov/geocoder/geographies/coordinates?x=" + lon + "&y=" + lat
      + "&benchmark=Public_AR_Current&vintage=Current_Current&layers=all&format=jsonp&callback=" + cb;
    document.head.appendChild(sc);
  });
}
// OpenStreetMap address suggestions (Photon, which permits type-ahead), US only
async function osmSuggest(q) {
  const r = await fetch("https://photon.komoot.io/api/?limit=6&lang=en&q=" + encodeURIComponent(q));
  const d = await r.json();
  return (d.features || []).filter(f => (f.properties || {}).countrycode === "US").map(f => {
    const p = f.properties;
    const line = [p.housenumber && p.street ? p.housenumber + " " + p.street : (p.name || p.street),
                  p.city || p.town || p.village || p.county, p.state, p.postcode].filter(Boolean).join(", ");
    return {label: line, lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1]};
  });
}

  const races = [{key:"house", title: state + "-" + (district || "AL") + " · House", ch:"house"},

function FindMyRep({members, onSelect}) {

          <div style=${{padding:"3px 9px",fontSize:7,color:"#4b5563",fontFamily:FM}}>Suggestions © OpenStreetMap contributors</div>
        </div>` : null}
      </div>

  const GAMMA = "https://gamma-api.polymarket.com";
  const CLOB  = "https://clob.polymarket.com";

  function safeFloat(v) {
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  function extractYesToken(mk) {
    const tokens = mk.tokens || mk.clobTokenIds || [];
    let yes = null, no = null;
    for (const tok of tokens) {
      if (tok && typeof tok === "object") {
        const out = (tok.outcome || "").toUpperCase();
        const tid = tok.token_id || tok.tokenId || "";
        if (out === "YES") yes = tid;
        if (out === "NO")  no  = tid;
      } else if (typeof tok === "string") {
        if (!yes) yes = tok;
        else if (!no) no = tok;
      }
    }
    return {yes, no};
  }

  async function refreshPredictIt(basePolyData) {
    // PredictIt has a public REST API — no auth, no token needed.
    // Group entries by market ID, then fetch each market once.
    const piEntries = Object.entries(basePolyData).filter(
      ([,pd]) => pd.src === "predictit_contract" && pd.url && pd.url.includes("/markets/detail/")
    );
    if (!piEntries.length) return {};

    const markets = {};
    for (const [name, pd] of piEntries) {
      const m = pd.url.match(/\/markets\/detail\/(\d+)\//);
      if (!m) continue;
      if (!markets[m[1]]) markets[m[1]] = [];
      markets[m[1]].push({name, pd});
    }

    const fresh = {};
    for (const [marketId, entries] of Object.entries(markets)) {
      try {
        const r = await fetch("https://www.predictit.org/api/marketdata/markets/" + marketId);
        if (!r.ok) continue;
        const data = await r.json();
        const contracts = data.Contracts || [];
        for (const {name, pd} of entries) {
          // question format from fetch_data.py: "Market question? → Candidate Name"
          const arrow = (pd.question || "").split("→").pop().trim().toLowerCase();
          const last  = name.split(" ").pop().toLowerCase();
          const first = name.split(" ")[0].toLowerCase();
          const contract = contracts.find(c => {
            const cn = (c.Name || c.ShortName || "").toLowerCase();
            return arrow ? cn.includes(arrow.split(" ").pop()) :
                           (cn.includes(last) || cn.includes(first));
          }) || (contracts.length === 1 ? contracts[0] : null);
          if (!contract) continue;
          // BestYesPrice = current market best ask; LastTradePrice = last trade
          const price = parseFloat(contract.BestYesPrice ?? contract.LastTradePrice ?? "");
          if (isNaN(price) || price < 0 || price > 1) continue;
          fresh[name] = {
            ...pd,
            prob:       price,
            src:        "predictit_contract",
            fetched_at: new Date().toISOString(),
          };
        }
      } catch {}
      await new Promise(r => setTimeout(r, 200));
    }
    if (Object.keys(fresh).length > 0)
      console.log("PredictIt refresh: " + Object.keys(fresh).length + "/" + piEntries.length + " updated");
    return fresh;
  }

  async function batchRefreshCLOB(basePolyData) {
    const tokenMap = {};  // token_id → candidate name
    for (const [name, pd] of Object.entries(basePolyData)) {
      if (pd.token_id) tokenMap[pd.token_id] = name;
    }
    const tokenIds = Object.keys(tokenMap);
    if (tokenIds.length === 0) return {};

    const fresh = {};
    try {
      const qs = tokenIds.map(id => "token_ids=" + encodeURIComponent(id)).join("&");
      const r  = await fetch(CLOB + "/midpoints?" + qs);
      if (r.ok) {
        const data = await r.json();
        const items = Array.isArray(data) ? data : (data.results || data.midpoints || []);
        for (const item of items) {
          const tid  = item.token_id || item.tokenId;
          const mid  = safeFloat(item.mid || item.price);
          const name = tokenMap[tid];
          if (name && mid !== null && mid >= 0 && mid <= 1) {
            fresh[name] = {
              ...basePolyData[name],
              prob:       mid,
              src:        "polymarket_live",
              fetched_at: new Date().toISOString(),
            };
          }
        }
        if (Object.keys(fresh).length > 0) {
          console.log("Poly batch CLOB: " + Object.keys(fresh).length + "/" + tokenIds.length + " refreshed");
          return fresh;
        }
      }
    } catch (e) {
      console.warn("Poly batch failed, falling back to individual:", e);
    }

    const chunkSize = 8;
    for (let i = 0; i < tokenIds.length; i += chunkSize) {
      const chunk = tokenIds.slice(i, i + chunkSize);
      await Promise.all(chunk.map(async tid => {
        try {
          const r = await fetch(CLOB + "/midpoint?token_id=" + encodeURIComponent(tid));
          if (!r.ok) return;
          const d   = await r.json();
          const mid = safeFloat(d.mid || d.price);
          const name = tokenMap[tid];
          if (name && mid !== null && mid >= 0 && mid <= 1) {
            fresh[name] = {
              ...basePolyData[name],
              prob:       mid,
              src:        "polymarket_live",
              fetched_at: new Date().toISOString(),
            };
          }
        } catch {}
      }));
      if (i + chunkSize < tokenIds.length) {
        await new Promise(r => setTimeout(r, 100));
      }
    }
    console.log("Poly individual CLOB: " + Object.keys(fresh).length + " refreshed");
    return fresh;
  }

  async function refreshPoly(memberList, racesList, basePolyData) {
    setPolyLoad(true);
    try {
      const [batchFresh, piFresh] = await Promise.all([
        batchRefreshCLOB(basePolyData),
        refreshPredictIt(basePolyData),
      ]);

      // new markets are discovered by the pipeline; the page only refreshes known prices
      const newFresh = {};
      const allFresh = {...batchFresh, ...piFresh};
      if (Object.keys(allFresh).length > 0) {
        setPolyLive(prev => ({...prev, ...allFresh}));
        setPolyUpd(new Date().toISOString());
        const newTokens = Object.entries(newFresh).filter(([,v]) => v.token_id);
        if (newTokens.length > 0) {
          setPolyBase(prev => {
            const updated = {...prev};
            newTokens.forEach(([k,v]) => { updated[k] = v; });
            return updated;
          });
        }
      }
    } catch (e) {
      console.warn("refreshPoly error:", e);
    }
    setPolyLoad(false);
  }

  useEffect(() => {
    fetch(HISTORY_URL + "?_=" + Date.now()).then(r => r.json()).then(d => {
      if (d.events) setHistory(d);
    }).catch(() => {});

    (async () => {
      try {
        const r = await fetch(DATA_URL + "?_=" + Date.now());
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();

        window._aectMeta = d.meta || {};
        window._aectCommittees = d.committees || [];
        // every candidate still running (all parties), for search and the ballot lookup
        window._aectField = (d.field || []).map(c => ({...c, antiArms: !!c.anti, _candidate: true,
          ps: c.general_result === "WON" ? "ELECTED" : c.general_result === "LOST" ? "DEFEATED"
            : c.primary_result === "WON" ? "WON" : "UPCOMING"}));
        let memberList = d.members || [];
        // The pipeline decides (official roll calls, FEC, trackers, AI review of sources).
        // Only its "hard" verdict is anti-establishment; everything else is establishment.
        memberList = memberList.map(m => ({
          ...m, antiFlagged: !!m.antiArms, antiArms: isAntiE(m),
          note: (m.note||"").replace(/[-–—]?\s*classified soft\.?/gi,"").trim(),
        }));

        setMembers(memberList);
        setBills(d.bills || []);
        if (d.congress_history && Object.keys(d.congress_history).length > 0) {
          setCongressHistory(d.congress_history);
        }

        window._appData = {descriptions: d.descriptions || {}};
        window._aectRetention = d.meta && d.meta.incumbent_retention != null ? d.meta.incumbent_retention : null;
        const allChalls = (d.candidates || []).filter(isAntiE)
          .map(c => ({...c, antiArms: true, ps: c.ps || "UPCOMING", chamber: c.chamber || "house"}));
        setChalls(allChalls);
        const raceList = d.races || d.races_2026 || [];
        if (raceList.length) setRaces(raceList);
        if (d.fec && Object.keys(d.fec).length > 0) setFec(d.fec);

        const baseP = (d.poly && Object.keys(d.poly).length > 0) ? d.poly : {};
        setPolyBase(baseP);

        if (d.meta && d.meta.fetched_at) setFetchedAt(d.meta.fetched_at);
        const anti  = memberList.filter(isHard).length;
        const age   = (d.meta && d.meta.fetched_at)
          ? Math.round((Date.now() - new Date(d.meta.fetched_at)) / 60000) : "?";
        setStatus("✓ " + anti + " anti-establishment" + " · " + memberList.length + " members · " + age + "m ago");
        clearTimeout(window._aectLoadTimeout);

        const racesList = d.races || d.races_2026 || [];
        refreshPoly(memberList, racesList, baseP);

      } catch (e) {
        const msg = e && e.message ? e.message : String(e);
        setStatus("⚠ " + msg + " — Check GitHub Actions has run and data.json exists.");
        console.error("data.json load error:", e);
        setLoaded(true);   // always unblock render even on error
        return;
      }
      setLoaded(true);
    })().catch(e => {
      console.error("useData IIFE rejected:", e);
      setStatus("⚠ Unexpected load error: " + (e && e.message ? e.message : e));
      setLoaded(true);
    });

    const _loadTimeout = setTimeout(() => {
      setLoaded(true);
      setStatus("⚠ Timed out loading data.json. Check GitHub Actions.");
    }, 10000);
    window._aectLoadTimeout = _loadTimeout;

  }, []);

  useEffect(() => {
    if (allMembers.length === 0) return;
    const id = setInterval(async () => {
      const [bFresh, pFresh] = await Promise.all([
        batchRefreshCLOB(polyBase),
        refreshPredictIt(polyBase),
      ]);
      const combined = {...bFresh, ...pFresh};
      if (Object.keys(combined).length > 0) {
        setPolyLive(prev => ({...prev, ...combined}));
        setPolyUpd(new Date().toISOString());
      }
    }, 5 * 60 * 1000);
    return () => clearInterval(id);
  }, [allMembers.length, polyBase]);

  const mergedPoly = {};
  const allPolyKeys = new Set([...Object.keys(polyBase), ...Object.keys(polyLive)]);
  for (const k of allPolyKeys) {
    mergedPoly[k] = polyLive[k] || polyBase[k];
  }

  const descriptions = (typeof window !== "undefined" && window._appData && window._appData.descriptions) || {};
  return {
    allMembers, bills, challengers, history, races, congressHistory, fecData,
    polyData:    mergedPoly,
    polyLive,
    polyUpdated: polyUpdated,
    polyLoading,
    fetchedAt,   status, loaded,
    descriptions,
  };
}

    return isNaN(d) ? null : d;
  }
  function fmtDate(d) {
    if (!d) return "";
    return d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
  }

  const seen = new Set();

  function normName(n) {
    return (n||"").replace(/^(congressman|senator|representative)\s+/i,"").trim().toLowerCase();
  }
  function addCand(c) {
    const key = normName(c.name);
    if (seen.has(key)) {
      const ex = allCands.find(x => x._key === key);
      if (ex) {
        if (c.primary_date && !ex.primary_date)   ex.primary_date   = c.primary_date;
        if (c.general_date && !ex.general_date)   ex.general_date   = c.general_date;

        if (c.win_prob_src && !ex.win_prob_src)   ex.win_prob_src   = c.win_prob_src;

      return;

      district:         m.district,
      chamber:          m.chamber || "house",
      primary_date:     race?.primary_date || "",
      general_date:     race?.general_date || GENERAL_DATE(),
      primary_result:   race?.primary_result || "",
      primary_pct:      race?.primary_pct || null,
      primary_opponent: race?.primary_opponent || "",
      general_opponent: race?.general_opponent || "",
      win_prob:         race?.win_prob ?? null,
      win_prob_src:     race?.win_prob_src || "",
      cook_rating:      race?.cook_rating || "",
      note:             race?.note || m.note || "",
      source:           "incumbent",
      ps:               m.ps,
    });
  });

  allCands.forEach(c => {
    const pd = getValidatedPoly(c, polyData);
    if (pd && pd.prob != null) {
      c.win_prob     = pd.prob;
      c.win_prob_src = pd.src || "polymarket";
      c.forecast_url = pd.url || "";
      if (pd.src === "grok_estimate" && pd.question && !c.win_prob_reasoning) {
        c.win_prob_reasoning = pd.question;
      }
    }
    const desc = descriptions && (descriptions[c.name] || descriptions[normName(c.name)]);
    if (desc && !c.description) c.description = desc;
  });

  function getStatus(c) {
    const pd = parseDate(c.primary_date);
    const gd = parseDate(c.general_date);
    const won = c.primary_result === "WON";

    if (won || c.ps === "GENERAL") {
      if (!gd) return {tag:"WON PRIMARY",      sub:"general date TBD",       color:"#4ade80", phase:"general"};
      const diff = Math.ceil((gd - today) / 86400000);
      if (diff < -3) return {tag:"GENERAL PENDING", sub:"results awaited "+fmtDate(gd), color:"#fbbf24", phase:"general"};
      if (diff < 0)  return {tag:"RECOUNT WINDOW",  sub:fmtDate(gd),                  color:"#f97316", phase:"general"};
      if (diff === 0)return {tag:"VOTING TODAY",     sub:"general election",            color:"#4ade80", phase:"general"};
      if (diff <= 14)return {tag:"GENERAL SOON",     sub:fmtDate(gd),                  color:"#4ade80", phase:"general"};
      return               {tag:"WON PRIMARY",       sub:"general "+fmtDate(gd),        color:"#4ade80", phase:"general"};
    }
    if (!pd)    return     {tag:"UPCOMING",          sub:"date TBD",                    color:"#4b5563", phase:"primary"};
    const diff = Math.ceil((pd - today) / 86400000);
    if (diff < -10) return {tag:"PENDING RESULTS",   sub:"primary "+fmtDate(pd),        color:"#f59e0b", phase:"primary"};
    if (diff < -1)  return {tag:"RUNOFF WINDOW",     sub:"primary "+fmtDate(pd),        color:"#f97316", phase:"primary"};
    if (diff < 0)   return {tag:"RESULTS TODAY",     sub:fmtDate(pd),                   color:"#4ade80", phase:"primary"};
    if (diff === 0) return {tag:"VOTING TODAY",      sub:"primary",                      color:"#4ade80", phase:"primary"};
    if (diff <= 7)  return {tag:"THIS WEEK",         sub:fmtDate(pd),                   color:"#a78bfa", phase:"primary"};
    if (diff <= 30) return {tag:"PRIMARY SOON",      sub:fmtDate(pd),                   color:"#818cf8", phase:"primary"};
    return               {tag:"UPCOMING PRIMARY",    sub:fmtDate(pd),                   color:"#4b5563", phase:"primary"};
  }

  function nextDate(c) {
    const won = c.primary_result === "WON" || c.ps === "GENERAL";
    const d = won ? parseDate(c.general_date)||parseDate(c.primary_date)
                  : parseDate(c.primary_date);
    return d ? d.getTime() : 9e15;
  }

  const filters = [
    {k:"all",     label:"All"},
    {k:"soon",    label:"< 30 days"},
    {k:"general", label:"In general"},
    {k:"pending", label:"Pending"},
    {k:"R",       label:"R candidates"},
    {k:"D",       label:"D candidates"},
  ];

  const sorted = [...allCands].sort((a,b) => nextDate(a)-nextDate(b));

  const displayed = sorted.filter(c => {
    if (filter === "R") return c.party === "R";
    if (filter === "D") return c.party !== "R";
    if (filter === "general") return c.primary_result === "WON" || c.ps === "GENERAL";
    if (filter === "pending") {
      const t = getStatus(c).tag;
      return t.includes("PENDING") || t.includes("RUNOFF") || t.includes("RESULTS");
    }
    if (filter === "soon") {
      const won = c.primary_result === "WON" || c.ps === "GENERAL";
      const d = won ? parseDate(c.general_date) : parseDate(c.primary_date);
      if (!d) return false;
      return Math.ceil((d-today)/86400000) <= 30;
    }
    return true;
  });

  function monthKey(c) {
    const won = c.primary_result === "WON" || c.ps === "GENERAL";
    const d = won ? parseDate(c.general_date)||parseDate(c.primary_date) : parseDate(c.primary_date);
    return d ? d.toLocaleDateString("en-US",{month:"long",year:"numeric"}) : "Date TBD";
  }

  const groups = [];
  displayed.forEach(c => {
    const mk = monthKey(c);
    let g = groups.find(x => x.key===mk);
    if (!g) { g = {key:mk, cands:[]}; groups.push(g); }
    g.cands.push(c);
  });

  function WinGauge({prob, src}) {
    if (prob == null) return null;
    const pct = Math.round(prob*100);
    const col = prob>=0.6 ? "#4ade80" : prob>=0.35 ? "#fbbf24" : "#f87171";
    const r=16, circ=Math.PI*r, dash=Math.min(1,prob)*circ;
    const w=44, h=24;
    const srcLabel = src==="polymarket_live" || src==="polymarket_gamma" || src==="polymarket"
      ? html`<span style=${{fontSize:6,color:"#4ade80",fontFamily:FM,lineHeight:1}}>◉ Poly</span>`
      : src==="predictit_contract"
      ? html`<span style=${{fontSize:6,color:"#f59e0b",fontFamily:FM,lineHeight:1}}>◈ PI</span>`
      : src==="predictit_party"
      ? html`<span style=${{fontSize:6,color:"#6b7280",fontFamily:FM,lineHeight:1}}>◇ PI~</span>`
      : src==="metaculus"
      ? html`<span style=${{fontSize:6,color:"#a78bfa",fontFamily:FM,lineHeight:1}}>△ Meta</span>`
      : src==="grok_estimate"
      ? html`<span style=${{fontSize:6,color:"#38bdf8",fontFamily:FM,lineHeight:1}}>✦ Grok</span>`
      : null;
    return html`
      <div style=${{display:"flex",flexDirection:"column",alignItems:"center",gap:1,width:44}}>
        <svg width=${w} height=${h} viewBox=${"0 0 "+w+" "+h}>
          <path d=${"M 6 "+(h-2)+" A "+r+" "+r+" 0 0 1 "+(w-6)+" "+(h-2)}
            fill="none" stroke="#1e2230" stroke-width="4" stroke-linecap="round"/>
          <path d=${"M 6 "+(h-2)+" A "+r+" "+r+" 0 0 1 "+(w-6)+" "+(h-2)}
            fill="none" stroke=${col} stroke-width="4" stroke-linecap="round"
            stroke-dasharray=${dash+" "+circ}/>
          <text x=${w/2} y=${h-5} text-anchor="middle" font-size="8"
            font-family="monospace" fill=${col} font-weight="700">${pct}%</text>
        </svg>
        ${srcLabel}
      </div>`;
  }

  function CandRow({c}) {
    const [exp, setExp] = useState(false);
    const st = getStatus(c);
    const pc = c.party==="R" ? "#ef4444" : c.party==="D" ? "#60a5fa" : "#a3e635";
    const loc = c.district
      ? c.state+"-"+(c.chamber==="senate"?"Sen":c.district)
      : c.state+(c.chamber==="senate"?" Senate":"");
    const won = c.primary_result==="WON" || c.ps==="GENERAL";
    const opp = won ? c.general_opponent : c.primary_opponent;
    const srcLabel = c.source==="rlc" ? "RLC" : c.source==="tracked" ? "Tracked" : c.source==="incumbent" ? "Incumbent" : "TrackAIPAC";

    return html`
      <div style=${{borderBottom:"1px solid #0d1018"}}>
        <div onClick=${()=>setExp(v=>!v)} style=${{
          display:"flex", alignItems:"center", gap:8,
          padding:"7px 10px", cursor:"pointer",
          borderLeft:"3px solid "+st.color+(exp?"90":"40"),
          background: exp?"#0a0c10":"transparent",
        }}>
          <div title=${c.win_prob_reasoning || c.win_prob_src || ""}>
            <${WinGauge} prob=${c.win_prob} src=${c.win_prob_src}/>
          </div>
          ${c.win_prob == null ? html`<div style=${{width:44,flexShrink:0,textAlign:"center",fontSize:7,color:"#374151",fontFamily:FM,lineHeight:1.2}}>no %<br/>data</div>` : null}

          <div style=${{flex:"0 0 148px",minWidth:0}}>
            <div style=${{fontSize:10,fontWeight:700,color:"#f0ebe0",fontFamily:FM,
              whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>${c.name}</div>
            <div style=${{fontSize:7,color:pc,fontFamily:FM,marginTop:1}}>
              ${c.party} · ${loc||"?"}
              <span style=${{color:"#374151",marginLeft:4}}>${srcLabel}</span>
            </div>
          </div>

          <div style=${{flex:1,minWidth:0}}>
            <div style=${{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
              <span style=${{fontSize:7,fontFamily:FM,padding:"1px 6px",borderRadius:3,
                background:st.color+"18",color:st.color,border:"1px solid "+st.color+"40",
                whiteSpace:"nowrap",letterSpacing:"0.05em"}}>${st.tag}</span>
              ${won && c.primary_pct ? html`
                <span style=${{fontSize:7,color:"#4ade80",fontFamily:FM}}>won ${c.primary_pct}%</span>` : null}
            </div>
            <div style=${{fontSize:7,color:"#4b5563",fontFamily:FM,marginTop:2,
              whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
              ${st.sub}${opp ? " · vs "+opp.slice(0,32)+(opp.length>32?"…":"") : ""}
            </div>
          </div>

          <span style=${{color:"#374151",fontSize:9,flexShrink:0}}>${exp?"▴":"▾"}</span>
        </div>
        ${exp && html`
          <div style=${{padding:"6px 12px 8px 63px",background:"#0a0c10",
            borderLeft:"3px solid "+st.color+"20",
            fontSize:8,color:"#6b7280",fontFamily:FM,lineHeight:1.6}}>
            ${c.description ? html`<div style=${{color:"#9ca3af",fontStyle:"italic",marginBottom:4}}>${c.description}</div>` : null}
            ${c.note||"No additional detail available."}
            ${c.website ? html`<br/><a href=${c.website} target="_blank"
              style=${{color:"#4b5563",textDecoration:"none"}}>→ campaign site</a>` : null}
          </div>`}
      </div>`;
  }

  const wonCount  = allCands.filter(c => c.primary_result==="WON"||c.ps==="GENERAL").length;
  const liveCount = allCands.filter(c => c.win_prob != null && c.win_prob_src).length;

  return html`
    <div style=${_SP}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"flex-start",
        marginBottom:8,flexWrap:"wrap",gap:6}}>
        <div>
          <div style=${{fontSize:11,fontWeight:700,color:"#f0ebe0",fontFamily:FM}}>
            ${CYCLE()} Anti-Intervention Candidates
          </div>
          <div style=${{fontSize:8,color:"#4b5563",fontFamily:FM,marginTop:1}}>
            ${allCands.length} candidates · ${wonCount} in/past primary · ${allCands.length-wonCount} upcoming
            ${liveCount>0 ? html` · <span style=${{color:"#4ade80"}}>◉ ${liveCount} live odds</span>` : null}
          </div>
        </div>
        <div style=${{display:"flex",gap:4,flexWrap:"wrap"}}>
          ${filters.map(f => html`
            <button key=${f.k} onClick=${e=>{e.stopPropagation();setFilter(f.k)}}
              style=${{padding:"2px 7px",borderRadius:4,cursor:"pointer",
                border:"1px solid #1e2230",fontFamily:FM,fontSize:7,
                background:filter===f.k?"#1e2230":"transparent",
                color:filter===f.k?"#a5b4fc":"#4b5563"}}>
              ${f.label}
            </button>`)}
        </div>
      </div>

      <div style=${{background:"#0f1117",border:"1px solid #1a1d27",borderRadius:11,overflow:"hidden"}}>
        ${groups.length===0
          ? html`<div style=${{padding:"18px",textAlign:"center",color:"#374151",fontFamily:FM,fontSize:8}}>
              No candidates match this filter.</div>`
          : groups.map(g => html`
            <div key=${g.key}>
              <div style=${{padding:"4px 10px",background:"#090b0e",fontSize:7,
                color:"#374151",fontFamily:FM,letterSpacing:"0.12em",
                textTransform:"uppercase",borderBottom:"1px solid #0d1018"}}>
                ${g.key}
                <span style=${{color:"#1e2230",marginLeft:5}}>${g.cands.length} candidate${g.cands.length!==1?"s":""}</span>
              </div>
              ${g.cands.map(c => html`<${CandRow} key=${c.name+c.state} c=${c}/>`)}
            </div>`)}
      </div>

      <div style=${{marginTop:6,fontSize:7,color:"#374151",fontFamily:FM,lineHeight:1.7}}>
        ◉ Poly = Polymarket · ◈ PI = PredictIt · ◇ PI~ = PredictIt proxy · △ Meta = Metaculus · ✦ Grok = Grok web estimate · no % data = no forecast found · TrackAIPAC/RLC = endorsing orgs
      </div>
    </div>`;
}

function SearchBox({members, onPick, inline}) {
  const [q, setQ] = useState(""), [open, setOpen] = useState(false);
  const field = window._aectField || [];
  const norm = x => (x || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const nq = norm(q.trim());
  const hits = nq.length < 2 ? [] : [
    ...members.filter(m => norm(m.name).includes(nq)).map(m => ({...m, _kind: "member"})),
    ...field.filter(c => norm(c.name).includes(nq)).map(c => ({...c, _kind: "candidate"})),
  ].slice(0, 9);
  const seat = p => p.chamber === "senate" ? p.state + " Sen." : p.state + "-" + (p.district || "AL");
  return html`<div style=${inline ? {position:"relative",zIndex:15,margin:"6px 6px 0"} : {position:"absolute",top:6,right:6,zIndex:15,width:"min(230px, 60%)"}}>
    <input value=${q} placeholder="Search members & candidates…" onInput=${e => { setQ(e.target.value); setOpen(true); }}
      onFocus=${() => setOpen(true)} onBlur=${() => setTimeout(() => setOpen(false), 180)}
      style=${{width:"100%",boxSizing:"border-box",background:"#090b0eee",border:"1px solid #252830",borderRadius:7,padding:"5px 8px",color:"#e8e4dc",fontSize:10,fontFamily:FM,outline:"none"}}/>
    ${open && hits.length ? html`<div style=${{position:inline?"absolute":"static",left:0,right:0,marginTop:3,background:"#0b0d12",border:"1px solid #1e2230",borderRadius:7,overflow:"hidden"}}>
      ${hits.map((h,i) => html`<div key=${i} onMouseDown=${() => { onPick(h); setQ(""); setOpen(false); }}
        style=${{padding:"6px 8px",cursor:"pointer",borderTop:i?"1px solid #1a1d27":"none",display:"flex",justifyContent:"space-between",gap:6}}>
        <span style=${{fontSize:10,color:"#e5e7eb"}}>${h.name} <span style=${{fontSize:8,color:"#6b7280",fontFamily:FM}}>${h.party} · ${seat(h)}</span></span>
        <span style=${{fontSize:8,fontFamily:FM,color:h.antiArms?(h.party==="R"?COL.antiR:COL.antiD):"#4b5563",whiteSpace:"nowrap"}}>
          ${h._kind === "member" ? "member" : h.primary_result === "LOST" ? "lost primary" : "candidate"}${h.antiArms ? " ◈" : ""}</span>
      </div>`)}
    </div>` : null}
  </div>`;
}

// ── Pinch to zoom (and drag when zoomed) on the hemicycle, by changing the SVG viewBox ──
function usePinchZoom(w, h) {
  const [vb, setVb] = useState([0, 0, w, h]);
  const pts = useRef(new Map()), start = useRef(null);
  useEffect(() => setVb([0, 0, w, h]), [w, h]);
  const toSvg = (el, x, y, box) => {
    const r = el.getBoundingClientRect();
    return [box[0] + (x - r.left) / r.width * box[2], box[1] + (y - r.top) / r.height * box[3]];
  };
  const clamp = b => {
    const bw = Math.min(w, Math.max(w / 5, b[2])), bh = bw * h / w;
    return [Math.max(0, Math.min(w - bw, b[0])), Math.max(0, Math.min(h - bh, b[1])), bw, bh];
  };
  const handlers = {
    onPointerDown: e => {
      pts.current.set(e.pointerId, [e.clientX, e.clientY]);
      start.current = {box: vb, pts: new Map(pts.current), moved: false};
    },
    onPointerMove: e => {
      if (!pts.current.has(e.pointerId)) return;
      pts.current.set(e.pointerId, [e.clientX, e.clientY]);
      const st = start.current, el = e.currentTarget;
      if (!st) return;
      const now = [...pts.current.values()], was = [...st.pts.values()];
      if (now.length >= 2 && was.length >= 2) {
        const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
        const k = d(was[0], was[1]) / Math.max(1, d(now[0], now[1]));
        const mid = [(was[0][0] + was[1][0]) / 2, (was[0][1] + was[1][1]) / 2];
        const c = toSvg(el, mid[0], mid[1], st.box);
        const bw = st.box[2] * k, bh = st.box[3] * k;
        setVb(clamp([c[0] - (c[0] - st.box[0]) * k, c[1] - (c[1] - st.box[1]) * k, bw, bh]));
        st.moved = true;
      } else if (now.length === 1 && st.box[2] < w - 0.5) {
        const r = el.getBoundingClientRect();
        const dx = (now[0][0] - was[0][0]) / r.width * st.box[2], dy = (now[0][1] - was[0][1]) / r.height * st.box[3];
        if (Math.abs(dx) + Math.abs(dy) > 2) { setVb(clamp([st.box[0] - dx, st.box[1] - dy, st.box[2], st.box[3]])); st.moved = true; }
      }
    },
    onPointerUp: e => {
      if (start.current && start.current.moved) { window._aectDragged = true; setTimeout(() => { window._aectDragged = false; }, 80); }
      pts.current.delete(e.pointerId); start.current = pts.current.size ? {box: vb, pts: new Map(pts.current)} : null; },
    onPointerCancel: e => { pts.current.delete(e.pointerId); start.current = null; },
    onWheel: e => {
      if (!e.ctrlKey && !e.metaKey) return;          // trackpad pinch / ctrl+wheel
      e.preventDefault();
      const c = toSvg(e.currentTarget, e.clientX, e.clientY, vb), k = Math.exp(e.deltaY * 0.01);
      setVb(clamp([c[0] - (c[0] - vb[0]) * k, c[1] - (c[1] - vb[1]) * k, vb[2] * k, vb[3] * k]));
    },
  };
  return {vb, zoomed: vb[2] < w - 0.5, reset: () => setVb([0, 0, w, h]), handlers};
}

function useIsPhone() {
  const q = "(max-width: 700px)";
  const [m, setM] = useState(() => typeof window !== "undefined" && window.matchMedia(q).matches);
  useEffect(() => { const mq = window.matchMedia(q), f = () => setM(mq.matches); mq.addEventListener("change", f); return () => mq.removeEventListener("change", f); }, []);
  return m;
}

          Anti-Establishment Congressional Tracker
        </h1>
        <div style=${{fontSize:9,color:"#6b7280",display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap",alignItems:"center"}}>
          <span style=${{fontFamily:FM,color:"#6b7280",fontSize:8}}>${status}</span>
          ${polyLoading ? html`<span style=${{fontFamily:FM,color:"#4ade80",fontSize:8}}>◉ fetching live odds…</span>` : null}
          ${!polyLoading && polyUpdated ? html`
            <span style=${{fontFamily:FM,color:"#4ade80",fontSize:8,opacity:0.7}}
              title=${"Polymarket live — " + Object.keys(polyLive||{}).length + " markets refreshed " + new Date(polyUpdated).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})}>
              · ◉ ${Object.keys(polyLive||{}).length} live odds · ${new Date(polyUpdated).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})}
            </span>` : html`<span style=${{fontFamily:FM,color:"#374151",fontSize:8}}>◎ odds from cache</span>`}
          ${fetchedAt?html`<span style=${{fontFamily:FM,color:"#374151",fontSize:8}}>
            · ${new Date(fetchedAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
          </span>`:null}
        </div>
      </div>

      <!-- Chamber toggle -->
      <div style=${{display:"flex",gap:2,background:"#161920",borderRadius:10,padding:3,marginBottom:9,border:"1px solid #1e2230"}}>
        ${["house","senate"].map(c=>html`
          <button key=${c} onClick=${()=>{setChamber(c);setSelected(null);setShowTimeline(false);setShowAbout(false);}}
            style=${{padding:"5px 15px",borderRadius:8,border:"none",cursor:"pointer",fontFamily:FM,fontSize:10,
              letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600,
              background:chamber===c?"#f0ebe0":"transparent",color:chamber===c?"#0a0c10":"#6b7280"}}>
            ${(c==="senate"?"Senate · ":"House · ")+((META().chamber_seats||{})[c]||(c==="senate"?100:435))}
          </button>`)}
        <button onClick=${()=>{setShowTimeline(v=>!v);setShowAbout(false);}}
          style=${{padding:"5px 15px",borderRadius:8,border:"none",cursor:"pointer",fontFamily:FM,fontSize:10,
            letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600,
            background:showTimeline?"#1a0a2e":"transparent",
            color:showTimeline?"#a5b4fc":"#6b7280",
            borderLeft:"1px solid #1e2230"}}>
          📈 Timeline
        </button>
        <button onClick=${()=>{setShowAbout(v=>!v);setShowTimeline(false);}}
          style=${{padding:"5px 15px",borderRadius:8,border:"none",cursor:"pointer",fontFamily:FM,fontSize:10,
            letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600,
            background:showAbout?"#1a0a2e":"transparent",
            color:showAbout?"#a5b4fc":"#6b7280",
            borderLeft:"1px solid #1e2230"}}>
          ⓘ About
        </button>
      </div>

      <!-- Legend + stat pills -->
      <div style=${{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"center",marginBottom:7}}>
        ${[
          {c:COL.estR,  bg:"rgba(220,38,38,.1)",   l:"Establishment R", n:chMem.filter(m=>side(m)==="R"&&!m.antiArms).length},
          {c:COL.antiR, bg:"rgba(252,165,165,.1)", l:"Anti-E R",        n:chMem.filter(m=>isHard(m)&&side(m)==="R").length},
          {c:COL.antiD, bg:"rgba(147,197,253,.1)", l:"Anti-E "+(chMem.some(m=>m.party==="I"&&isHard(m))?"D/I":"D"), n:chMem.filter(m=>isHard(m)&&side(m)==="D").length},
          {c:COL.estD,  bg:"rgba(37,99,235,.1)",   l:"Establishment D", n:chMem.filter(m=>side(m)==="D"&&!m.antiArms).length},
          {c:"#9ca3af", bg:"transparent", faded:true, l:"Leaving (faded)", n:chMem.filter(m=>LEAVING.includes(m.ps)).length},
        ].map(b=>html`
          <span key=${b.l} style=${{display:"inline-flex",alignItems:"center",gap:4,background:b.bg,border:"1px solid "+b.c+"30",borderRadius:5,padding:"2px 7px",fontSize:9,fontFamily:FM,color:b.c}}>
            <span style=${{width:5,height:5,borderRadius:"50%",background:b.c,opacity:b.faded?0.35:1,display:"inline-block"}}/>
            ${b.l+" "+b.n}
          </span>`)}
        <button onClick=${()=>setShowAnti(v=>!v)}
          style=${{padding:"2px 7px",borderRadius:5,border:"1px solid #7c3aed33",background:showAnti?"#7c3aed1a":"transparent",color:showAnti?"#c084fc":"#4b5563",fontFamily:FM,fontSize:9,cursor:"pointer"}}>
          ${showAnti?"Show all":"Highlight anti-establishment"}
        </button>

      </div>

      <!-- Three columns / Timeline toggle -->
      ${showAbout ? html`<${About} members=${allMembers}/>` : showTimeline ? html`
        <div style=${{width:"100%",maxWidth:860,display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
          ${inGeneralPhase(races)
            ? html`<${ElectionTimeline} races=${races} onSelect=${r => setSelected(r.name)}/>`
            : html`<${CandidateTimeline} allMembers=${allMembers} challengers=${challengers} polyData=${polyData} racesData=${races} descriptions=${descriptions || {}}/>`}
        </div>`
      : html`
      <div class="three-col" style=${{display:"flex",gap:10,alignItems:"flex-start",flexWrap:"wrap",justifyContent:"center",width:"100%",maxWidth:1080}}>

        <${MemberBox} title="Anti-Establishment Republicans" color=${COL.antiR}
          members=${sideR} challengers=${challR} racesData=${races}
          fecData=${fecData} polyData=${polyData}
          onSelect=${m=>setSelected(m.name===selected?null:m.name)}/>

        <div class="ctr-col" style=${{display:"flex",flexDirection:"column",gap:7,alignItems:"center",flex:1,minWidth:0}}>

          <!-- Hemicycle SVG -->
          <div style=${{position:"relative",background:"#0f1117",border:"1px solid #1a1d27",borderRadius:13,overflow:"visible",width:"100%",maxWidth:610}}>
            <${SearchBox} members=${allMembers} onPick=${pickSearch} inline=${phone}/>
            ${zoom.zoomed ? html`<button onClick=${zoom.reset} style=${{position:"absolute",left:6,top:6,zIndex:15,padding:"3px 8px",borderRadius:6,border:"1px solid #252830",background:"#090b0eee",color:"#9ca3af",fontFamily:FM,fontSize:9,cursor:"pointer"}}>⤢ reset zoom</button>` : null}
            <svg class="hemi" width=${svgW} height=${svgH} viewBox=${zoom.vb.join(" ")} ...${zoom.handlers}
              style=${{display:"block",width:"100%",height:"auto",borderRadius:13,touchAction:zoom.zoomed?"none":"pan-y"}}>
              ${Array.from({length:chamber==="senate"?4:9},(_,i)=>(chamber==="senate"?80:52)+i*(chamber==="senate"?28:22)).map((r,i)=>
                html`<path key=${i} d=${"M "+(cx-r)+" "+cy+" A "+r+" "+r+" 0 0 1 "+(cx+r)+" "+cy} fill="none" stroke="#111419" stroke-width="1"/>`
              )}
              ${positions.map((pos,i)=>{
                if (!pos || pos._filler) return html`<circle key=${i} cx=${pos?pos._x:-999} cy=${pos?pos._y:-999} r=${dotR} fill="#111419" opacity=".4"/>`;
                const dimDot = showAnti && !isHard(pos);
                const leaving = LEAVING.includes(pos.ps);
                const isSel  = selected === pos.name;
                const isHov  = hovered  === pos.name;
                const color  = dotColor(pos);
                const poly   = getValidatedPoly(pos, polyData, races);
                const atRisk = poly && poly.prob < 0.65 && pos.antiArms;
                const r      = isHov ? dotR+1.5 : dotR;
                return html`<g key=${i}>
                  ${isSel?html`<circle cx=${pos._x} cy=${pos._y} r=${dotR+5} fill="none" stroke=${color} stroke-width="1.5" opacity=".4"/>`:null}

                  <circle cx=${pos._x} cy=${pos._y} r=${r}
                    fill=${dimDot?"#111419":color} opacity=${dimDot?0.12:leaving?0.35:1}
                    stroke=${isSel?"#fff":"none"} stroke-width="1.5"
                    style=${{cursor:"pointer", transition:"r 0.1s"}}
                    onClick=${()=>{ if (window._aectDragged) return; setSelected(selected===pos.name?null:pos.name);setHovered(pos.name);}}
                    onMouseEnter=${()=>setHovered(pos.name)}
                    onMouseLeave=${()=>setHovered(null)}
                    />
                  ${isHov?(()=>{
                    const bl = bottomLine(pos), line = bl.length > 64 ? bl.slice(0,63) + "…" : bl;
                    const w = Math.max(pos.name.length*4.6+10, line.length*3.55+10);
                    const tx = pos._x + 7 + w > svgW - 4 ? pos._x - 7 - w : pos._x + 7;
                    const ty = Math.max(2, pos._y - 22);
                    return html`<g pointer-events='none'>
                    <rect x=${tx} y=${ty} width=${w} height='22' rx='3'
                      fill='#0a0c10' opacity='0.96' stroke='#1e2230' stroke-width='0.5'/>
                    <text x=${tx+4} y=${ty+7} font-size='7' font-family='monospace'
                      fill='#e5e7eb' dominant-baseline='middle'>${pos.name}</text>
                    <text x=${tx+4} y=${ty+16} font-size='5.6' font-family='monospace'
                      fill=${pos.antiArms ? dotColor(pos) : '#9ca3af'} dominant-baseline='middle'>${line}</text>
                  </g>`;})():null}
                </g>`;
              })}
              <line x1=${cx} y1=${cy} x2=${cx} y2=${cy-(chamber==="senate"?164:228)-20} stroke="#1e2230" stroke-width="1" stroke-dasharray="3,3"/>
              <rect x=${cx-10} y=${cy-(chamber==="senate"?164:228)-29} width="20" height="11" rx="3" fill="#0e1016" stroke="#1e2230" stroke-width="0.5"/>
              <text x=${cx} y=${cy-(chamber==="senate"?164:228)-23} font-size="6" font-family="monospace" fill="#4b5563" text-anchor="middle" dominant-baseline="middle">${chamber==="senate"?"51":"218"}</text>
              <text x=${cx-200} y="11" fill=${COL.estR} font-size="7" font-family="monospace" text-anchor="middle" opacity=".7">Establishment R</text>
              <text x=${cx}     y="11" font-size="7" font-family="monospace" text-anchor="middle" opacity=".8"><tspan fill=${COL.antiR}>Anti-establishment</tspan><tspan fill=${COL.antiD}> R · D</tspan></text>
              <text x=${cx+200} y="11" fill=${COL.estD} font-size="7" font-family="monospace" text-anchor="middle" opacity=".7">Establishment D</text>
              <ellipse cx=${cx} cy=${cy+6} rx="18" ry="6" fill="#0f1117"/>
              <rect x=${cx-3} y=${cy-7} width="6" height="13" fill="#0f1117" rx="2"/>
            </svg>
          </div>

          <!-- Detail panel: beside the chart on a computer, full screen on a phone -->
          ${phone ? (selMember ? html`<div style=${{position:"fixed",inset:0,zIndex:100,background:"#0a0c10",overflowY:"auto",padding:"46px 14px 30px"}}>
              <button onClick=${() => setSelected(null)} aria-label="Close"
                style=${{position:"fixed",top:10,right:12,zIndex:101,width:34,height:34,borderRadius:17,border:"1px solid #252830",background:"#12151c",color:"#e5e7eb",fontSize:18,cursor:"pointer"}}>×</button>
              <${DetailPanel} member=${selMember} fecData=${fecData} polyData=${polyData} bills=${bills} chamber=${chamber} races=${races}/>
            </div>` : null)
          : html`<div style=${{width:"100%",maxWidth:610,background:"#0f1117",border:"1px solid #1a1d27",borderRadius:11,padding:"10px 13px",minHeight:70}}>
            <${DetailPanel} member=${selMember} fecData=${fecData} polyData=${polyData} bills=${bills} chamber=${chamber} races=${races}/>
          </div>`}

          <!-- Progress bars -->
          <div style=${_SP}>
            <${ProgressBars} chamber=${chamber} members=${chMem} allMembers=${allMembers} challengers=${challengers} racesData=${races} polyData=${polyData}/>
          </div>

          <!-- Legislation -->
          <div style=${_SP}>
            <${BillsPanel} bills=${bills}/>
          </div>

          <!-- History -->
          <div style=${_SP}>
            <${HistoryTimeline} history=${history}/>
          </div>

          <!-- Find My Rep -->
          <div style=${_SP}>
            <${FindMyRep} members=${allMembers} onSelect=${p => { setSelected(p.name); window.scrollTo({top:0,behavior:"smooth"}); }}/>
          </div>
        </div>

        <${MemberBox} title="Anti-Establishment Democrats" color=${COL.antiD}
          members=${sideD} challengers=${challD} racesData=${races}
          fecData=${fecData} polyData=${polyData}
          onSelect=${m=>setSelected(m.name===selected?null:m.name)}/>

      </div>

      `}

      <div style=${{fontSize:8,color:"#1a1d27",marginTop:14,fontFamily:FM,textAlign:"center",maxWidth:800,lineHeight:1.8}}>
        MEMBERS: TRACKAIPAC.COM (D/I) + RLC LIBERTY INDEX (R) · VOTES: CONGRESS.GOV HOUSE-VOTE API + CLERK XML
        <br/>MEMBERS: HOUSE CLERK + SENATE.GOV · VOTES: CLERK + VOTEVIEW · CANDIDATES & FINANCE: OPENFEC · ODDS: POLYMARKET · KALSHI · PREDICTIT · DISTRICTS: US CENSUS · REFRESH: 4H GITHUB ACTIONS
        <br/><a href="https://github.com/LukeRDavis/Anti-Establishment-Congressional-Tracker" target="_blank" style=${{color:"#374151"}}>github.com/LukeRDavis/Anti-Establishment-Congressional-Tracker</a>
      </div>
    </div>`;
}

render(html`<${App}/>`, document.getElementById("app"));

</script>
</body>
</html>
