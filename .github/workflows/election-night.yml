name: Election Night

# Every 15 minutes; the script exits at once unless a general election is
# within 36 hours before / 96 hours after (date read from data.json).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: election-night
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh odds, freeze at poll close, results
        run: python -u scripts/election_night.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data.json candidates.json history.json data/cache; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "chore: election-night refresh [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
